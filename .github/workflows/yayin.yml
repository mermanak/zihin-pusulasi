name: Yayın (web ve Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Kaynak dosyaları aç
        run: unzip -q -o kaynak.zip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projeyi hazırla
        run: bash arac/hazirla.sh

      - name: Paketleri indir
        working-directory: _app
        run: flutter pub get

      - name: Kodu kontrol et
        working-directory: _app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Web sürümünü derle
        working-directory: _app
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/uygulama/"

      - name: Siteyi topla
        run: python3 arac/site.py _app/build/web _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: yayin
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Kaynak dosyaları aç
        run: unzip -q -o kaynak.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projeyi hazırla
        run: bash arac/hazirla.sh

      - name: Paketleri indir
        working-directory: _app
        run: flutter pub get

      - name: Deneme imza anahtarını yerleştir
        run: |
          mkdir -p ~/.android
          cp arac/deneme.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: _app
        run: flutter build apk --release

      - name: İndirme sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp _app/build/app/outputs/flutter-apk/app-release.apk Zihin-Pusulasi.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum Zihin-Pusulasi.apk \
            --title "Zihin Pusulası - deneme sürümü" \
            --notes "Android telefon ve tabletlere kurmak için Zihin-Pusulasi.apk dosyasına dokunun. Derlenme: $(date -u '+%Y-%m-%d %H:%M') UTC" \
            --target "$GITHUB_SHA" --latest
